name: Refetch English posters

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not commit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run refetch script
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/refetch_posters_en.mjs --dry-run
          else
            node tools/refetch_posters_en.mjs
          fi

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- catalogo.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "Refetch English posters from TMDb"
          git push
