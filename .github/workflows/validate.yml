name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate app.js syntax
        run: node --check app.js

      - name: Validate service-worker.js syntax
        run: node --check service-worker.js

      - name: Validate manifest.webmanifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));console.log('manifest OK')"

      - name: Validate catalog schema
        run: node tools/validate_catalog.mjs

  validate-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse escaneo.R
        run: Rscript -e "invisible(parse(file='escaneo.R')); cat('escaneo.R OK\n')"

      - name: Parse enriquecimiento.R
        run: Rscript -e "invisible(parse(file='enriquecimiento.R')); cat('enriquecimiento.R OK\n')"
