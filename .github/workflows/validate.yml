name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate catalogo.json
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('catalogo.json','utf8'));
            if (!Array.isArray(c)) throw new Error('catalogo.json no es un array');
            console.log('catalogo.json OK: ' + c.length + ' entradas');
          "

      - name: Validate app.js syntax
        run: node --check app.js

      - name: Validate service-worker.js syntax
        run: node --check service-worker.js

      - name: Validate manifest.webmanifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));console.log('manifest OK')"
